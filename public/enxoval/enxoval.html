:root{--carvao:#0B1115;--ultra:#2A3DE0;--ultrac:#9AA7FF;--concreto:#E9EAE5;--nevoa:#C9CCC6;--grafite:#4A545B;--marfim:#E8D9BE;--rule:#C9CCC6}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:64px}
body{font-family:Inter,system-ui,sans-serif;color:var(--carvao);background:#fff;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border-radius:0}
:focus-visible{outline:2px solid var(--ultra);outline-offset:2px}
.lab,.m{font:500 11px/16px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ultra)}.lab.m,.m{color:var(--grafite)}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 5vw;border-bottom:1px solid var(--rule)}
h1,h2,h3,h4{font-family:'Instrument Sans',Inter,sans-serif;font-weight:600;letter-spacing:-.025em;line-height:1.05}
.hero{padding:72px 5vw 56px;max-width:1760px;margin:auto}.hero h1{font-size:clamp(40px,6vw,92px);max-width:1100px;margin:20px 0}
.lead{font-size:18px;line-height:28px;color:var(--grafite);max-width:720px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);margin-top:44px}.pal div{padding:60px 18px 16px;display:flex;flex-direction:column;gap:4px}.pal b{font:600 20px 'Instrument Sans'}.pal i{font:400 11px 'IBM Plex Mono';letter-spacing:.1em;font-style:normal;opacity:.85}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:0;background:#fff;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);overflow-x:auto;padding:0 5vw}
.tabs a{padding:16px 22px 14px 0;margin-right:22px;font:500 12px 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;border-bottom:2px solid transparent}.tabs a:hover{border-color:var(--ultra)}.tabs b{color:var(--ultra);margin-right:10px;font-weight:500}
.index{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:36px;padding:56px 5vw;max-width:1760px;margin:auto}
.ix .lab{border-bottom:2px solid var(--carvao);padding-bottom:10px;margin-bottom:2px}.ix ol{list-style:none;padding:0}.ix li a{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:baseline}.ix li a:hover span{color:var(--ultra)}
.ix b{font:500 11px 'IBM Plex Mono';color:var(--ultra)}.ix span{font:600 16px 'Instrument Sans'}.ix em{font:400 11px 'IBM Plex Mono';font-style:normal;color:var(--grafite);letter-spacing:.06em}
.sec{padding:80px 5vw;border-top:1px solid var(--rule)}.sec.alt{background:#F4F4F1}.sec>*{max-width:1760px;margin-left:auto;margin-right:auto}
.sh{margin-bottom:44px}.sh h2{font-size:clamp(30px,3.6vw,56px);max-width:980px;margin:14px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:56px 40px}.card.wide{grid-column:span 2}
@media(max-width:860px){.card.wide{grid-column:auto}.pal{grid-template-columns:1fr 1fr}}
.card>header,.kc>header{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:12px}.card>header b{font:500 11px 'IBM Plex Mono';color:var(--ultra)}.card h3{font-size:22px;flex:1}.card>header span,.kc>header span{font:500 11px 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--grafite)}
.cv{position:relative;background:var(--concreto)}.cv .mock svg{display:block;width:100%;height:auto}.card.wide .cv .mock{max-width:100%}
.plus{position:absolute;top:12px;right:12px;width:44px;height:44px;border:0;background:var(--ultra);color:#fff;font:400 26px/1 Inter}.plus:hover{background:#1d2ba8}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 24px;padding:14px 0;border-bottom:1px solid var(--rule)}.spec>div{padding:8px 0;border-bottom:1px solid #eceeea}.spec dt{font:500 10.5px 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--ultra)}.spec dd{font-size:13.5px;line-height:20px;color:var(--carvao);margin:2px 0 0}.spec .nota{grid-column:1/-1}
.opts{display:flex;flex-wrap:wrap;gap:12px 22px;padding:14px 0;border-bottom:1px solid var(--rule)}.f{display:flex;flex-direction:column;gap:6px;min-width:150px}.f>span{font:500 10.5px 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--grafite)}.f em{font-style:normal;color:var(--ultra)}
.f input{border:1px solid var(--nevoa);background:#fff;padding:9px 10px;font:14px Inter;border-radius:0;color:var(--carvao);min-width:190px}.f input:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--nevoa);background:#fff;padding:7px 12px;font:500 11px 'IBM Plex Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--carvao);display:inline-flex;align-items:center;gap:8px}.chip i{width:12px;height:12px;display:inline-block;box-shadow:inset 0 0 0 1px #9AA09A}.chip.on{background:var(--carvao);color:#fff;border-color:var(--carvao)}.chip:disabled{opacity:.4;cursor:not-allowed}
.dls{padding-top:10px}.dlr{display:grid;grid-template-columns:1fr;gap:6px 14px;padding:8px 0;border-bottom:1px solid #eceeea;align-items:start}.dlr b{font:600 14px 'Instrument Sans'}.dlr span{display:flex;flex-wrap:wrap;gap:6px}
.dl{border:1px solid var(--nevoa);background:#fff;color:var(--carvao);padding:6px 10px;font:500 10.5px 'IBM Plex Mono';letter-spacing:.06em}.dl:hover{background:var(--ultra);color:#fff;border-color:var(--ultra)}
@media(max-width:560px){.dlr{grid-template-columns:1fr}}
.foot{padding:56px 5vw;background:var(--carvao);color:#E9EAE5}.foot .lab{color:var(--ultrac)}.foot ul{max-width:760px;margin:16px 0 36px;padding-left:18px;color:var(--nevoa)}.foot li{margin:6px 0}.foot .lab.m{color:#C9CCC6}
/* onboarding */
.kitg{display:grid;grid-template-columns:minmax(min(300px,100%),420px) 1fr;gap:48px;margin-bottom:40px}@media(max-width:960px){.kitg{grid-template-columns:1fr}}
.score .big{display:flex;align-items:baseline;gap:10px;margin:8px 0 22px}.score .big b{font:600 96px/1 'Instrument Sans';letter-spacing:-.04em}.score .big span{font:500 14px 'IBM Plex Mono';color:var(--grafite)}
.bar{position:relative;height:14px;background:#fff;border:1px solid var(--nevoa);margin-bottom:36px}.bar i{position:absolute;inset:0 auto 0 0;background:var(--ultra);transition:none}.bar u{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--carvao);text-decoration:none}.bar u.on{background:var(--carvao)}.bar s{position:absolute;top:26px;left:-14px;font:500 10px 'IBM Plex Mono';text-decoration:none;color:var(--grafite)}.bar u:first-of-type s{left:0}.bar u:last-of-type s{left:-28px}
.lvl{font-size:15px}.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}.presets button{border:1px solid var(--carvao);background:#fff;padding:8px 12px;font:500 11px 'IBM Plex Mono';letter-spacing:.1em;text-transform:uppercase}.presets button:hover{background:var(--carvao);color:#fff}
.sub{margin:34px 0 14px;border-bottom:2px solid var(--carvao);padding-bottom:10px}.kitg .sub{margin-top:0}
.trks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:12px}.trk{text-align:left;border:1px solid var(--nevoa);background:#fff;padding:14px 14px 14px 46px;position:relative;display:block}.trk b{font:500 11px 'IBM Plex Mono';color:var(--ultra)}.trk h4{font-size:17px;margin:2px 0 6px}.trk p{font-size:12.5px;line-height:18px;color:var(--grafite)}.trk em{display:block;margin-top:8px;font:500 10.5px 'IBM Plex Mono';font-style:normal;letter-spacing:.08em;color:var(--grafite);text-transform:uppercase}
.trk .ck{position:absolute;left:14px;top:16px;width:20px;height:20px;border:1.5px solid var(--carvao)}.trk.on{background:var(--carvao);color:#fff;border-color:var(--carvao)}.trk.on p,.trk.on em{color:var(--nevoa)}.trk.on b{color:var(--ultrac)}.trk.on .ck{background:var(--ultra);border-color:var(--ultra)}.trk.on .ck:after{content:"";position:absolute;left:5px;top:1px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;border-top:2px solid var(--carvao)}.tier{padding:16px 16px 18px 0;border-right:1px solid var(--rule);padding-left:16px}.tier:first-child{padding-left:0}.tier:last-child{border-right:0}.tier b{font:500 11px 'IBM Plex Mono';letter-spacing:.14em;color:var(--ultra);text-transform:uppercase}.tier h4{font-size:22px;margin:4px 0 6px}.tier p{font-size:12.5px;line-height:18px;color:var(--grafite)}.tier.now h4{color:var(--ultra)}.tier.lock{opacity:.6}
.kitopts{border-top:0}.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:30px 20px}
.kc .cv{background:var(--concreto)}.kc>header{margin:10px 0 6px;padding-bottom:8px}.kc h4{font-size:17px;flex:1}.kc.lk .mock{opacity:.22;filter:grayscale(1)}.lockb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;background:rgba(244,244,241,.35)}.lockb b{font:500 11px 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;background:var(--carvao);color:#fff;padding:7px 10px}.lockb span{font:500 10.5px 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--grafite)}
.kc details summary{font:500 11px 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--ultra);cursor:pointer;padding:6px 0}.kc .dlr{grid-template-columns:1fr}
.note{margin-top:30px;font-size:13px;color:var(--grafite);max-width:760px;border-top:1px solid var(--rule);padding-top:12px}

.top{gap:16px}.back{white-space:nowrap}.top>a{display:inline-flex;align-items:center;min-height:44px}@media(max-width:700px){.hide-s{display:none}}

const R=(x,y,w,h,fill,o={})=>`<rect x="${fix(x)}" y="${fix(y)}" width="${fix(w)}" height="${fix(h)}" fill="${fill||'none'}"${o.st?` stroke="${o.st}" stroke-width="${o.sw||1}"${o.da?` stroke-dasharray="${o.da}"`:''}`:''}${o.op?` opacity="${o.op}"`:''}/>`;

const mockSvg=(it,o,one)=>{MW=it.wide&&!one?1200:600;MH=it.wide&&!one?(it.mh||440):440;const r=`<svg viewBox="0 0 ${MW} ${MH}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(it.name)}">${one&&MOCK[it.id+'One']?MOCK[it.id+'One'](o):MOCK[it.id](o)}</svg>`;MW=600;MH=440;return r};

const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fmtMM=n=>String(+n.toFixed(1)).replace('.',',');
/* ---- presets de download por face ---- */
function presets(it,i,o){const a=artOf(it,i,o),u=faceUnit(it,i),P=[];
 if(u=='mm'){const mx=Math.max(a.w,a.h)+2*a.b,dpi=Math.min(300,Math.floor(8000/(mx/25.4)/ (mx>600?25:1))||72);
  const d=a.transp?300:(mx>600?100:dpi>=300?300:dpi);
  P.push({k:'svg',label:'SVG vetorial'+(a.b?' · com sangria':''),bleed:true});
  P.push({k:'png',label:`PNG ${d} dpi · ${fmtMM(a.w)} × ${fmtMM(a.h)} mm${a.transp?' · transparente':''}`,w:Math.round(a.w/25.4*d),h:Math.round(a.h/25.4*d),bleed:false,tr:a.transp});
  if(!a.transp)P.push({k:'pdf',label:`PDF ${d} dpi · ${fmtMM(a.w+2*a.b)} × ${fmtMM(a.h+2*a.b)} mm c/ sangria`,w:Math.round((a.w+2*a.b)/25.4*d),h:Math.round((a.h+2*a.b)/25.4*d),bleed:true,mm:[a.w+2*a.b,a.h+2*a.b]});
 }else{P.push({k:'svg',label:'SVG vetorial'});
  let list=it.px?(it.pxi?[it.px[i]]:it.px):[[a.w,a.h]];if(it.extra&&it.extra[i])list=list.concat(it.extra[i]);
  list.forEach(s=>{const sc=s[0]/a.w;P.push({k:'png',label:`PNG ${s[0]} × ${s[1]} px`,w:s[0],h:Math.round(a.h*sc),bleed:false})})}
 return P}
function svgDoc(a,bleed,w,h,tr){const b=bleed?a.b:0,vx=-b,vw=a.w+2*b,vh=a.h+2*b;
 return `<svg xmlns="http://www.w3.org/2000/svg" width="${w||fix(vw)}" height="${h||fix(vh)}" viewBox="${vx} ${vx} ${fix(vw)} ${fix(vh)}"><defs><style>${window.FONTCSS}</style></defs>${a.inner}</svg>`}
function download(blob,name){const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();setTimeout(()=>{l.remove();URL.revokeObjectURL(u)},800)}
function raster(svg,w,h,bg){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(bg){x.fillStyle=bg;x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);res(c)};im.onerror=rej;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
function pdfFromJpeg(jpg,wpx,hpx,wmm,hmm){const W=(wmm*72/25.4).toFixed(2),H=(hmm*72/25.4).toFixed(2),enc=new TextEncoder(),parts=[],off=[];let len=0;
 const push=x=>{const b=typeof x=='string'?enc.encode(x):x;parts.push(b);len+=b.length};
 push('%PDF-1.4\n');const obj=(n,body)=>{off[n]=len;push(`${n} 0 obj\n`);push(body);push('\nendobj\n')};
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
 off[4]=len;push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${wpx} /Height ${hpx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream\nendobj\n');
 const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;obj(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
 const x0=len;push('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)push(String(off[i]).padStart(10,'0')+' 00000 n \n');push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${x0}\n%%EOF`);
 return new Blob(parts,{type:'application/pdf'})}
async function runDl(itId,fi,pi,o){const it=byId(itId),a=artOf(it,fi,o),p=presets(it,fi,o)[pi],base=`arque-${it.id}-${slug(faceName(it.faces[fi]))}`+(it.o&&it.o.includes('cor')?'-'+o.cor:'');
 const u=faceUnit(it,fi),dim=u=='mm'?`${fmtMM(a.w)}x${fmtMM(a.h)}mm`:`${a.w}x${a.h}px`;
 if(p.k=='svg')return download(new Blob([svgDoc(a,true)],{type:'image/svg+xml'}),`${base}-${dim}.svg`);
 const svg=svgDoc(a,p.bleed,p.w,p.h),c=await raster(svg,p.w,p.h,p.k=='pdf'||(!a.transp&&u=='px')?null:null);
 if(p.k=='png'){const b=await new Promise(r=>c.toBlob(r,'image/png'));return download(b,`${base}-${p.w}x${p.h}px.png`)}
 const c2=document.createElement('canvas');c2.width=p.w;c2.height=p.h;const x=c2.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,p.w,p.h);x.drawImage(c,0,0);
 const jb=await new Promise(r=>c2.toBlob(r,'image/jpeg',.95)),jpg=new Uint8Array(await jb.arrayBuffer());download(pdfFromJpeg(jpg,p.w,p.h,p.mm[0],p.mm[1]),`${base}-${dim}.pdf`)}

function optsHtml(it,o,pre,lock){if(!it.o)return'';return `<div class="opts">${it.o.map(k=>{const d=OPT[k],id=`${pre}-${k}`,lk=lock&&lock[k];

 const L=d.v;return `<div class="f"><span>${d.l}</span><div class="chips">${L.map(v=>`<button class="chip${o[k]==v?' on':''}" data-it="${it.id}" data-k="${k}" data-v="${v}"${lk?' disabled':''}>${d.lab?d.lab[v]:v}</button>`).join('')}</div></div>`}).join('')}</div>`}
function dlHtml(it,o){return `<div class="dls">${it.faces.map((f,fi)=>`<div class="dlr"><b>${esc(faceName(f))}</b><span>${presets(it,fi,o).map((p,pi)=>`<button class="dl" data-dl="${it.id}|${fi}|${pi}">${p.label}</button>`).join('')}</span></div>`).join('')}</div>`}

 const tiers=TIERS.map(x=>`<div class="tier${x.id==t?' now':''}${x.id>t?' lock':''}"><b>${x.id==0?'Padrão':x.pts+' pts'}</b><h4>${x.name}</h4><p>${x.opens}</p></div>`).join('');
 const lock={cor:t<1,frente:t<1,acab:t<4},ctrl=`<div class="opts kitopts"><label class="f"><span>Nome</span><input data-kit="nome" value="${esc(KS.nome)}" maxlength="28"></label><label class="f"><span>Cargo</span><input data-kit="cargo" value="${esc(KS.cargo)}" maxlength="28"></label>
 <div class="f"><span>Cor das peças ${t<1?'<em>· libera no nível Princípio</em>':''}</span><div class="chips">${['carvao','ultramar','concreto','branco'].map(c=>`<button class="chip${KS.cor==c?' on':''}" data-kit="cor" data-v="${c}"${t<1?' disabled':''}><i style="background:${TONE[c].bg}"></i>${COR[c]}</button>`).join('')}</div></div>

function saveKit(keepFocus){store.set('arque-kit',KS);const a=document.activeElement,k=a&&a.dataset&&a.dataset.kit,pos=a&&a.selectionStart,y=scrollY;renderKit();if(keepFocus&&k){const n=$(`[data-kit="${k}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}scrollTo(0,y);sendH()}
